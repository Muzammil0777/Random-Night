<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Login links carry a one-time token in the URL: other sites only ever get our origin, never the path or
         query (and the token is stripped at load anyway). Sign in with Google needs at least this policy. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0a0c18" />
    <meta name="description" content="You choose the vibe. We create the night. Curated nights out in Hyderabad: pick your area, budget and vibe, go solo, with friends, or meet new people." />
    <!-- Installable app (PWA): Android reads the manifest; iPhone uses the apple-* tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Random Night" />
    <title>Random Night</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
